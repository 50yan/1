TrajectoryPlannerROS:
  max_vel_x: 0.35
  min_vel_x: 0.05
  max_vel_theta: 0.8
  min_in_place_vel_theta: 0.3
  acc_lim_x: 1.0
  acc_lim_theta: 1.5
  holonomic_robot: false
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vtheta_samples: 20
  meter_scoring: true
  pdist_scale: 0.8
  gdist_scale: 0.6
  occdist_scale: 0.02
